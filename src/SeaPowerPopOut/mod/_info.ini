[Language_en]
Name=R.A.T.S. Pop-Out Windows
Description=Move the formation manager, message log, unit status and the other windows onto a second monitor with one click on their title bar. They float freely there - the desktop shows around them - snap to each other and are remembered for the next mission. Wide resize corners on every window. Window handling on the main screen too: remembered positions and sizes, double-click to maximize, snapping, a settings panel, window opacity, and a better Unit Reference (search in descriptions, loadout variants, earliest variant, armed only, splitter). Needs the mod loader R.A.T.S. Keel.

[Compatibility]
GreaterThanEqualToVersion=0.9.0
LessThanVersion=0.10.0
