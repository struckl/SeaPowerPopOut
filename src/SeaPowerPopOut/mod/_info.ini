Name=Sea Power Pop-Out Windows
Description=Move the formation manager, message log, unit status and the other windows onto a second monitor with one click on their title bar. They float freely there - the desktop shows around them - snap to each other and are remembered for the next mission. Wide resize corners on every window. Window handling on the main screen too: remembered positions and sizes, double-click to maximize, snapping, a settings panel, window opacity, and a better Unit Reference (search in descriptions, loadout variants, earliest variant, armed only, splitter). Requires Anchor Chain.

